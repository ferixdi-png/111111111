name: Verify published hello page

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Wait for GitHub Pages rebuild
        run: sleep 20

      - name: Read Pages configuration
        run: |
          curl -sS -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            -w "\nHTTP_STATUS:%{http_code}\n" \
            "https://api.github.com/repos/ferixdi-png/wow/pages" \
            > wow-pages-info.txt
          cat wow-pages-info.txt

      - name: Check live page
        run: |
          curl -sS -L \
            -o live-page-body.html \
            -w "HTTP_STATUS:%{http_code}\nFINAL_URL:%{url_effective}\n" \
            "https://ferixdi-png.github.io/wow/hello/" \
            > live-page-check.txt
          grep -o "Привет" live-page-body.html | head -1 >> live-page-check.txt || true
          cat live-page-check.txt

      - name: Save verification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wow-pages-info.txt live-page-check.txt
          git commit -m "Record live Pages verification" || true
          git push || true
