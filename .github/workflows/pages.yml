name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.actor != 'github-actions[bot]'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Find repositories with Pages already enabled
        run: |
          curl -sS -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/users/${{ github.repository_owner }}/repos?per_page=100&type=owner" \
            | jq -r '.[] | select(.has_pages == true) | .full_name' \
            > pages-enabled-repos.txt
          cat pages-enabled-repos.txt

      - name: Try to enable Pages through API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          RESPONSE=$(curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            -w "\nHTTP_STATUS:%{http_code}\n" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"build_type":"workflow"}')
          printf '%s\n' "$RESPONSE" > pages-api-status.txt
          cat pages-api-status.txt

      - name: Save diagnostic results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages-api-status.txt pages-enabled-repos.txt
          git commit -m "Record Pages diagnostics" || true
          git push || true

      - name: Enable and configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
